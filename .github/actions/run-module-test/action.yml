name: Run Module Compatibility Test
description: >
  Shared steps for running a Puppet module through the compatibility harness.
  Handles checkout, prerequisites, Ruby/Python setup, runner invocation,
  status recording, summary writing, artifact upload, and failure diagnostics.

inputs:
  module-json:
    description: 'JSON-encoded matrix module object'
    required: true
  module-id:
    description: 'Stable module identifier for paths and artifact names'
    required: true
  profile:
    description: 'Compatibility profile name'
    required: false
    default: '8-latest-maintained'
  metadata-mode:
    description: 'Metadata handling mode (warn|fail)'
    required: false
    default: 'warn'
  test-mode:
    description: 'Test mode: unit or acceptance'
    required: false
    default: 'unit'
  allow-acceptance:
    description: 'Pass --allow-acceptance flag'
    required: false
    default: 'false'
  beaker-setfile:
    description: 'Path to Beaker setfile (acceptance only)'
    required: false
    default: ''
  output-dir:
    description: 'Output directory for results'
    required: true
  artifact-name:
    description: 'Name for the uploaded artifact'
    required: true
  test-lane:
    description: 'Test lane label (unit or acceptance)'
    required: false
    default: 'unit'
  acceptance-target:
    description: 'Acceptance target name (acceptance only)'
    required: false
    default: 'unit'
  prereqs-json:
    description: 'JSON-encoded prereqs object'
    required: false
    default: '{}'
  docker-mode:
    description: 'Docker container mode: sshd (default) or systemd'
    required: false
    default: 'sshd'
  install-puppetserver:
    description: 'Install Puppet Core server (puppetserver) in acceptance test image'
    required: false
    default: 'false'
  enable-debug:
    description: 'Enable verbose debug output (captures Docker logs, acceptance output)'
    required: false
    default: 'false'
  setup-commands:
    description: 'JSON array of additional shell commands to run during SUT image build (e.g. AppArmor disable)'
    required: false
    default: '[]'
  pre-acceptance-commands:
    description: 'JSON array of shell commands to run on the host before Beaker starts (e.g. start supporting services like GitLab or Squid)'
    required: false
    default: '[]'
  provisioner:
    description: "Acceptance SUT provisioner: 'docker' (default) or 'gcp' (a real VM via the DevX provision service — see docs/vm-based-acceptance-testing.md)"
    required: false
    default: 'docker'
  vm-image:
    description: "GCP image family (provisioner=gcp only), e.g. 'rocky-linux-cloud/rocky-linux-9'"
    required: false
    default: ''
  beaker-env-json:
    description: 'JSON object of extra environment variables merged into the acceptance test environment before Beaker runs (acceptanceTarget.beaker_env)'
    required: false
    default: '{}'

runs:
  using: composite
  steps:
    - name: Enable Git long paths on Windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        git config --global core.longpaths true
        git config --global --get core.longpaths

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Install module prerequisites on Ubuntu
      if: runner.os == 'Linux'
      shell: bash
      env:
        PREREQS_JSON: ${{ inputs.prereqs-json }}
      run: |
        set -euo pipefail
        apt_pkgs=$(echo "$PREREQS_JSON" | python -c "import json,sys; d=json.load(sys.stdin); pkgs=d.get('apt',[]); print(' '.join(pkgs)) if pkgs else None")
        if [ -n "$apt_pkgs" ]; then
          sudo apt-get update -qq
          sudo apt-get install -y $apt_pkgs
        fi

    - name: Install module prerequisites on Windows
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        PREREQS_JSON: ${{ inputs.prereqs-json }}
      run: |
        $prereqs = $env:PREREQS_JSON | ConvertFrom-Json
        if ($null -ne $prereqs -and $null -ne $prereqs.choco -and $prereqs.choco.Count -gt 0) {
          choco install -y @($prereqs.choco)
        }

    - name: Install module prerequisites on macOS
      if: runner.os == 'macOS'
      shell: bash
      env:
        PREREQS_JSON: ${{ inputs.prereqs-json }}
      run: |
        set -euo pipefail
        brew_pkgs=$(echo "$PREREQS_JSON" | python -c "import json,sys; d=json.load(sys.stdin); pkgs=d.get('brew',[]); print(' '.join(pkgs)) if pkgs else None")
        if [ -n "$brew_pkgs" ]; then
          brew update
          brew install $brew_pkgs
        fi

    - name: Install sshpass (VM provisioner only)
      if: inputs.provisioner == 'gcp' && runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update -qq
        sudo apt-get install -y -qq sshpass

    - name: Resolve Ruby version from profile
      id: resolve_ruby
      shell: bash
      env:
        PROFILE_NAME: ${{ inputs.profile }}
      run: |
        set -euo pipefail
        version=$(python -c "
        import json, os, sys
        with open('profiles/puppet_profiles.json') as f:
            data = json.load(f)
        name = os.environ['PROFILE_NAME']
        match = next((p for p in data['profiles'] if p['name'] == name), None)
        if not match:
            sys.exit(f\"Profile '{name}' not found in profiles/puppet_profiles.json\")
        print(match['ruby_version'])
        ")
        echo "Resolved ruby_version=$version for profile '$PROFILE_NAME'"
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ steps.resolve_ruby.outputs.version }}
        bundler-cache: true

    - name: Install runner
      shell: bash
      run: bundle install

    - name: Build single-module config
      shell: bash
      run: |
        mkdir -p .tmp
        ruby -rjson -e "mod=JSON.parse(ENV.fetch('MODULE_JSON')); File.write('.tmp/single-module.json', JSON.pretty_generate({'modules'=>[{'repo'=>mod.fetch('repo'),'ref'=>mod.fetch('ref','main')}] }))"
      env:
        MODULE_JSON: ${{ inputs.module-json }}

    - name: Run compatibility runner
      id: run_runner
      continue-on-error: true
      shell: bash
      env:
        PUPPET_ACCEPTANCE_DEBUG: ${{ inputs.enable-debug }}
        # All of these come from action inputs — which trace back to
        # config/modules.json content — as env vars rather than interpolated
        # into the script text below, so nothing in them (a quote, a `$(...)`,
        # a `;`) can break out of a shell string or be executed.
        RUNNER_PROFILE: ${{ inputs.profile }}
        RUNNER_TEST_MODE: ${{ inputs.test-mode }}
        RUNNER_OUTPUT_DIR: ${{ inputs.output-dir }}
        RUNNER_ALLOW_ACCEPTANCE: ${{ inputs.allow-acceptance }}
        RUNNER_BEAKER_SETFILE: ${{ inputs.beaker-setfile }}
        RUNNER_DOCKER_MODE: ${{ inputs.docker-mode }}
        RUNNER_INSTALL_PUPPETSERVER: ${{ inputs.install-puppetserver }}
        RUNNER_SETUP_COMMANDS: ${{ inputs.setup-commands }}
        RUNNER_PRE_ACCEPTANCE_COMMANDS: ${{ inputs.pre-acceptance-commands }}
        RUNNER_PROVISIONER: ${{ inputs.provisioner }}
        RUNNER_VM_IMAGE: ${{ inputs.vm-image }}
        RUNNER_BEAKER_ENV: ${{ inputs.beaker-env-json }}
      run: |
        runner_args=(
          --modules-file .tmp/single-module.json
          --profiles-file profiles/puppet_profiles.json
          --profile "$RUNNER_PROFILE"
          --test-mode "$RUNNER_TEST_MODE"
          --workspace-dir w
          --output-dir "$RUNNER_OUTPUT_DIR"
        )
        if [ "$RUNNER_ALLOW_ACCEPTANCE" = "true" ]; then
          runner_args+=(--allow-acceptance)
        fi
        if [ -n "$RUNNER_BEAKER_SETFILE" ]; then
          runner_args+=(--beaker-setfile "$RUNNER_BEAKER_SETFILE")
        fi
        if [ "$RUNNER_DOCKER_MODE" = "systemd" ]; then
          runner_args+=(--docker-mode systemd)
        fi
        if [ "$RUNNER_INSTALL_PUPPETSERVER" = "true" ]; then
          runner_args+=(--install-puppetserver)
        fi
        if [ "$RUNNER_SETUP_COMMANDS" != "[]" ] && [ "$RUNNER_SETUP_COMMANDS" != "" ]; then
          runner_args+=(--setup-commands "$RUNNER_SETUP_COMMANDS")
        fi
        if [ "$RUNNER_PRE_ACCEPTANCE_COMMANDS" != "[]" ] && [ "$RUNNER_PRE_ACCEPTANCE_COMMANDS" != "" ]; then
          runner_args+=(--pre-acceptance-commands "$RUNNER_PRE_ACCEPTANCE_COMMANDS")
        fi
        if [ "$RUNNER_PROVISIONER" = "gcp" ]; then
          runner_args+=(--provisioner gcp)
        fi
        if [ -n "$RUNNER_VM_IMAGE" ]; then
          runner_args+=(--vm-image "$RUNNER_VM_IMAGE")
        fi
        if [ "$RUNNER_BEAKER_ENV" != "{}" ] && [ "$RUNNER_BEAKER_ENV" != "" ]; then
          runner_args+=(--beaker-env "$RUNNER_BEAKER_ENV")
        fi
        ruby bin/puppet-module-tester "${runner_args[@]}"

    - name: Record module status
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$OUTPUT_DIR"
        python scripts/classify_module_result.py
      env:
        OUTPUT_DIR: ${{ inputs.output-dir }}
        REPORT: ${{ inputs.output-dir }}/compatibility-report.json
        STATUS_FILE: ${{ inputs.output-dir }}/module-status.json
        MODULE_ID: ${{ inputs.module-id }}
        TEST_LANE: ${{ inputs.test-lane }}
        ACCEPTANCE_TARGET: ${{ inputs.acceptance-target }}
        PROFILE: ${{ inputs.profile }}
        PROFILES_FILE: profiles/puppet_profiles.json

    - name: Write module summary
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        python scripts/render_module_job_summary.py
      env:
        STATUS_FILE: ${{ inputs.output-dir }}/module-status.json
        MODULE_ID: ${{ inputs.module-id }}
        ARTIFACT_NAME: ${{ inputs.artifact-name }}

    - name: Show failure diagnostics
      if: steps.run_runner.outcome == 'failure'
      shell: bash
      env:
        OUTPUT_DIR: ${{ inputs.output-dir }}
        MODULE_ID: ${{ inputs.module-id }}
        TEST_LANE: ${{ inputs.test-lane }}
      run: bash scripts/show_diagnostics.sh "$OUTPUT_DIR" "$MODULE_ID" "$TEST_LANE"
