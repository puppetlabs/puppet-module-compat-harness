name: Actions Freshness

# Monthly audit of third-party GitHub Actions used by this harness: all refs
# SHA-pinned, no retired Node runtimes, no archived repos. Newer releases are
# reported in the job summary but never fail the run. See
# scripts/check_action_freshness.py. Read-only; handles no secrets.

on:
  schedule:
    - cron: "0 6 1 * *"  # 06:00 UTC on the 1st of each month
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freshness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Check action freshness
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/check_action_freshness.py
